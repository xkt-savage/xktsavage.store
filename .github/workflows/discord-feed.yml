name: Discord feed

# Copia las publicaciones de los canales del panel (config.json -> discordFeed.channels)
# a discord/feed.json cada 10 minutos. Sin hosting: corre en GitHub.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build feed
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python .github/scripts/discord-feed.py
      - name: Commit feed
        run: |
          git config user.name "xkt-feed-bot"
          git config user.email "xkt-feed-bot@users.noreply.github.com"
          git add discord/feed.json
          git diff --cached --quiet || git commit -m "Discord feed: sincronizar publicaciones"
          git push
